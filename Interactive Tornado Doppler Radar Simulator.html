<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Interactive Tornado Doppler Radar Simulator</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; }
        .subtitle { color: #aaa; margin-bottom: 20px; }
        .controls {
            background: #1e1e1e;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        label { font-weight: bold; }
        input[type=range] { cursor: pointer; }
        .canvas-container {
            display: flex;
            gap: 20px;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        canvas {
            border: 2px solid #333;
            background-color: #050505;
        }
    </style>
</head>
<body>

    <h1>NEXRAD Doppler Radar Simulator</h1>
    <div class="subtitle">Real-time Mesocyclone Hook Echo &amp; Velocity Couplet Simulation</div>

    <div class="controls">
        <label for="rotSlider">Rotation Speed (Vortex Strength):</label>
        <input type="range" id="rotSlider" min="10" max="90" value="45">
        <span id="rotVal">76 m/s</span>
    </div>

    <div class="canvas-container">
        <div>
            <h3 style="text-align:center; color:#00ffcc;">REFLECTIVITY (dBZ)</h3>
            <canvas id="refCanvas" width="400" height="400"></canvas>
        </div>
        <div>
            <h3 style="text-align:center; color:#00ffcc;">VELOCITY (m/s)</h3>
            <canvas id="velCanvas" width="400" height="400"></canvas>
        </div>
    </div>

    <script>
        const refCanvas = document.getElementById('refCanvas');
        const velCanvas = document.getElementById('velCanvas');
        const refCtx = refCanvas.getContext('2d');
        const velCtx = velCanvas.getContext('2d');

        const width = refCanvas.width;
        const height = refCanvas.height;
        const cx = width / 2;
        const cy = height / 2;

        let frame = 0;
        let vMax = 45;

        document.getElementById('rotSlider').addEventListener('input', (e) => {
            vMax = parseFloat(e.target.value);
            document.getElementById('rotVal').innerText = vMax + " m/s";
        });

        // Color maps
        function getDbzColor(dbz) {
            if (dbz < 15) return [0, 0, 0];
            if (dbz < 30) return [0, 235, 235];   // Cyan
            if (dbz < 40) return [0, 200, 0];     // Green
            if (dbz < 50) return [255, 255, 0];   // Yellow
            if (dbz < 60) return [255, 0, 0];     // Red
            if (dbz < 70) return [210, 0, 180];   // Pink
            return [255, 255, 255];               // White
        }

        function getVelColor(v) {
            if (Math.abs(v) < 2) return [60, 60, 60];
            if (v < -25) return [0, 255, 255];    // Bright Cyan (Inbound)
            if (v < 0)   return [0, 220, 0];      // Green (Inbound)
            if (v < 25)  return [220, 0, 0];      // Red (Outbound)
            return [255, 0, 255];                 // Pink (Fast Outbound)
        }

        function drawRadar() {
            const refImg = refCtx.createImageData(width, height);
            const velImg = velCtx.createImageData(width, height);

            // Dynamic offset simulating storm motion
            const stormX = cx + Math.sin(frame * 0.02) * 20;
            const stormY = cy - Math.cos(frame * 0.02) * 15;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;

                    // Distance and angle from mesocyclone center
                    const dx = x - stormX;
                    const dy = y - stormY;
                    const dist = Math.sqrt(dx * dx + dy * dy) + 0.001;
                    const angle = Math.atan2(dy, dx);

                    // Rankine Vortex Model
                    const vTangential = dist < 25 ? (dist / 25) * vMax : (25 / dist) * vMax;
                    const vInflow = dist < 40 ? -12 * (dist / 40) : -12 * (40 / dist);

                    const uWind = -vTangential * Math.sin(angle) + vInflow * Math.cos(angle);
                    const vWind =  vTangential * Math.cos(angle) + vInflow * Math.sin(angle);

                    // Hook Echo Reflectivity Formulation
                    const spiralAngle = angle + 0.03 * dist;
                    const hookPattern = Math.exp(-Math.pow(dist - 35, 2) / 400) * (1 + Math.cos(spiralAngle - frame * 0.05));
                    const coreIntensity = Math.exp(-Math.pow(dist, 2) / 600) * 65;
                    const dbz = Math.min(75, Math.max(0, coreIntensity + hookPattern * 40));

                    // Doppler Radial Velocity (Radar at bottom-left: 0, height)
                    const rx = x - 0;
                    const ry = y - height;
                    const rDist = Math.sqrt(rx * rx + ry * ry) + 0.001;
                    const vRadial = uWind * (rx / rDist) + vWind * (ry / rDist);

                    // Render Reflectivity
                    const [rR, rG, rB] = getDbzColor(dbz);
                    refImg.data[idx]     = rR;
                    refImg.data[idx + 1] = rG;
                    refImg.data[idx + 2] = rB;
                    refImg.data[idx + 3] = 255;

                    // Render Velocity
                    const [vR, vG, vB] = getVelColor(vRadial);
                    velImg.data[idx]     = vR;
                    velImg.data[idx + 1] = vG;
                    velImg.data[idx + 2] = vB;
                    velImg.data[idx + 3] = 255;
                }
            }

            refCtx.putImageData(refImg, 0, 0);
            velCtx.putImageData(velImg, 0, 0);

            // Draw Range Rings
            [refCtx, velCtx].forEach(ctx => {
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(cx, cy, 60, 0, Math.PI * 2);
                ctx.arc(cx, cy, 120, 0, Math.PI * 2);
                ctx.stroke();
            });

            frame++;
            requestAnimationFrame(drawRadar);
        }

        drawRadar();
    </script>

</body></html>
